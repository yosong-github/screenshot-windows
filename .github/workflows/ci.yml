name: CI

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build Pegline.sln -c Release
      - name: Test
        run: dotnet test Pegline.sln -c Release --no-build
      - name: Publish
        run: dotnet publish src/Pegline.App/Pegline.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: pegline-win-x64
          path: publish/Pegline.exe
